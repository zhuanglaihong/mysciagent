site_name: MySciAgent
site_description: 个人操作系统与实用 Agents 管理平台，连接科研资料、代码与日常事务
site_url: https://zhuanglaihong.github.io/mysciagent/
repo_url: https://github.com/zhuanglaihong/mysciagent
repo_name: zhuanglaihong/mysciagent
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 开始使用:
      - 搭建自己的助手: personalize.md
      - 快速开始: setup.md
      - 能力地图: capabilities.md
      - 仓库配合: repositories.md
      - 架构: architecture.md
      - 环境迁移: portability.md
  - 服务:
      - Hermes 渠道: hermes-channels.md
      - OpenClaw 渠道: openclaw-channels.md
      - 邮件 (himalaya): email.md
      - 联系人 (cardamum): contacts.md
      - 飞书 CLI (lark-cli): lark-cli.md
      - TDAI 长期记忆: tdai-memory.md
      - Google Drive 论文: google-drive-rclone.md
      - Zotero 文献 (mylibrary): zotero-cli-cc.md
  - 通用工具:
      - dailyinfo 调度: dailyinfo.md
      - 事务追踪 (aisecretary): aisecretary.md
      - 语雀知识库: yuque-mcp-hermes.md
      - 论文清单 (paper-queue): paper-queue.md
      - 千问听记（可选）: qwennote-mcp-hermes.md
  - 团队应用案例:
      - iHeadWater 工作流: team-use-cases.md
      - 共享服务部署: server-deploy.md
      - 团队接入自检: member-check.md
      - 天一研发日报: daily-dev-report.md
      - 知汛水文助手: zhixun-feishu-bot.md
      - 团队服务器监控 MCP: server-monitoring-mcp.md
  - 运维:
      - 调度系统: scheduling.md
      - Hermes Skill 机制: hermes-skills.md
      - 备份系统: backup.md
      - 服务监控: monitoring.md
      - AgentOps 健康采集: agentops.md
      - DNS 配置: dns-setup.md
      - 同步与查看更新: upstream-sync.md
      - 文档站预览与发布: docs-site.md
  - 设计与规划:
      - 科研助手规划: research-platform-roadmap.md
      - 研究引擎接入: research-engine-integration.md
      - AI Scientist 调研: ai-scientist-landscape.md
      - Linux 落地计划: linux-delivery-plan.md
      - Linux 环境参考: linux-server-setup.md
      - 仓库迁移状态: migration-status.md

exclude_docs: |
  upstream/
